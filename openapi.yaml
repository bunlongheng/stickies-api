# The client surface, the part stickies-native and stickies-web call.
#
# This is the contract swift-openapi-generator reads to produce typed Swift
# models, so it is not documentation that can quietly rot: tests/contract.test.ts
# calls the running service and validates real responses against these schemas,
# and a drift becomes a failing test rather than a broken client.
#
# Admin surfaces (keys, automations, integrations, backup, gdrive, hue) are
# deliberately absent. No client generates code for them.
openapi: 3.1.0
info:
  title: stickies-api
  version: 0.1.0
  description: Notes, folders, sharing and realtime for stickies-web and stickies-native.
servers:
  - url: http://localhost:4446
    description: local
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An access token from /auth/google, or a STICKIES_API_KEY for agents.
  schemas:
    Note:
      type: object
      required: [id, title, folder_name, folder_color, is_folder, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        content: { type: [string, "null"] }
        folder_name: { type: string }
        folder_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        folder_id: { type: [string, "null"], format: uuid }
        parent_folder_name: { type: [string, "null"] }
        parent_folder_id: { type: [string, "null"], format: uuid }
        user_id: { type: string, description: Owner scope. Set from the caller, never from the body. }
        order: { type: integer }
        type:
          type: [string, "null"]
          enum: [text, html, json, javascript, typescript, python, css, sql, bash, checklist, null]
        format: { type: string, enum: [text, rich], default: text }
        doc: { type: [object, "null"], description: ProseMirror document for rich notes }
        icon: { type: [string, "null"] }
        is_folder: { type: boolean }
        is_public: { type: boolean }
        locked: { type: boolean, description: Passcode gate on the public share }
        frozen: { type: boolean, description: Owner write-protect. Edits and deletes return 423. }
        list_mode: { type: boolean }
        tags: { type: [array, "null"], items: { type: string } }
        trashed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_by_key: { type: [string, "null"] }
        created_by_machine: { type: [string, "null"] }
        task_count: { type: integer }
        task_done_count: { type: number }
        task_remaining_count: { type: integer }
    Folder:
      type: object
      required: [id, folder_name, folder_color]
      properties:
        id: { type: string, format: uuid }
        folder_name: { type: string }
        folder_color: { type: string }
        parent_folder_name: { type: [string, "null"] }
        order: { type: integer }
        content: { type: [string, "null"], description: The folder icon lives here. }
        updated_at: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
        code: { type: string }
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, example: 900 }
        user:
          type: object
          required: [id, email]
          properties:
            id: { type: string }
            email: { type: string, format: email }
  responses:
    Unauthorized:
      description: No credential, or one that does not resolve.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Authenticated, but not permitted. API keys cannot delete or manage keys.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

paths:
  /health:
    get:
      summary: Liveness and database reachability
      security: []
      responses:
        '200':
          description: Serving
          content:
            application/json:
              schema:
                type: object
                required: [ok, db, liveClients, uptimeSec]
                properties:
                  ok: { type: boolean }
                  db: { type: string, enum: [ok, down] }
                  dbLatencyMs: { type: integer }
                  liveClients: { type: integer }
                  uptimeSec: { type: integer }
        '503': { description: Database unreachable }

  /auth/google:
    post:
      summary: Trade a Google id_token for an access and refresh pair
      description: >
        Native runs the Google flow in ASWebAuthenticationSession, web runs it in
        the page. The id_token is verified against Google's public keys with the
        audience pinned to our client id, so no client secret is involved.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties: { id_token: { type: string } }
      responses:
        '200':
          description: Signed in
          content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } }
        '400': { $ref: '#/components/responses/Unauthorized' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Not the owner account, or the address is unverified.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /auth/refresh:
    post:
      summary: Mint a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties: { refresh_token: { type: string } }
      responses:
        '200':
          description: Refreshed
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  expires_in: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /live:
    get:
      summary: Realtime event stream
      description: >
        Server-sent events. Named events are note-created, note-updated,
        note-deleted and api-request, plus ready on connect and ping every 25s.
        A payload over 8KB arrives with content and doc stripped and
        content_omitted true; fetch the full row with GET /notes?id=.
        Read it with URLSession.bytes on Swift, EventSource in a browser.
      responses:
        '200':
          description: The stream
          content: { text/event-stream: { schema: { type: string } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notes:
    get:
      summary: Read notes
      description: >
        One path, several read modes, selected by query parameter and evaluated
        in the order listed here. With none of them set it returns the board.
      parameters:
        - { name: id, in: query, schema: { type: string, format: uuid }, description: One note, full row including content }
        - { name: folder, in: query, schema: { type: string }, description: One folder's notes }
        - { name: since, in: query, schema: { type: string, format: date-time }, description: With folder, only what changed since. Delta sync. }
        - { name: q, in: query, schema: { type: string }, description: Search. A leading skill name scopes to that skill. }
        - { name: recent, in: query, schema: { type: string, enum: [today, all] } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 30, default: 1 }, description: With recent=today, widens the window in 24h steps. }
        - { name: counts, in: query, schema: { type: string, enum: ['1'] }, description: Per-folder totals for the board. }
        - { name: folders, in: query, schema: { type: string, enum: ['1'] } }
        - { name: prefs, in: query, schema: { type: string, enum: ['1'] }, description: Pinned folders. }
        - { name: export, in: query, schema: { type: string, enum: ['1'] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: Shape depends on the mode.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      notes: { type: array, items: { $ref: '#/components/schemas/Note' } }
                      total: { type: integer }
                      syncedAt: { type: string, format: date-time }
                      delta: { type: boolean }
                  - type: object
                    properties:
                      note: { $ref: '#/components/schemas/Note' }
                  - type: object
                    properties:
                      folders: { type: array, items: { $ref: '#/components/schemas/Folder' } }
                  - type: object
                    properties:
                      counts: { type: object, additionalProperties: { type: integer } }
                      countsByFolderId: { type: object, additionalProperties: { type: integer } }
                      latestByFolderId: { type: object, additionalProperties: { type: string } }
                      total: { type: integer }
                      todayCount: { type: integer }
                  - type: object
                    properties:
                      pinned_folders: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create a note or a folder
      description: >
        Send one note as JSON, raw markdown with a text content-type, or a batch
        of up to 500. A keyed caller re-posting the same title in the same folder
        updates that note in place; an owner POST always inserts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [content]
                  properties:
                    title: { type: string, description: Derived from frontmatter, a heading, or the first line when absent. }
                    content: { type: string }
                    folder: { type: string, default: CLAUDE, description: Accepts a path like CLAUDE/Work. Fuzzy matched. }
                    color: { type: string, description: Least-used palette colour when absent. }
                    type: { type: string }
                    icon: { type: string, description: Must be a supported name, else 422 with the list. }
                    resurface: { type: boolean, default: true, description: On a keyed re-post, bump created_at so it ranks as new. }
                - type: object
                  required: [batch]
                  properties:
                    batch: { type: array, maxItems: 500, items: { type: object } }
                - type: array
                  description: Compact form, [["note",title,content,folder,color], ["folder",name,color,parent]]
                  items: { type: array }
          text/markdown:
            schema: { type: string }
      responses:
        '201':
          description: Created, or updated on a keyed upsert.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  action: { type: string, enum: [created, updated] }
                  message: { type: string }
                  color: { type: string }
                  color_name: { type: string }
                  note: { $ref: '#/components/schemas/Note' }
        '400': { description: Missing content, an empty folder, or an unknown root folder. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: A folder with that name already exists at this level. }
        '422':
          description: Unsupported icon. The body carries supported_icons.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    patch:
      summary: Update notes, rename or merge folders, set pinned folders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [id]
                  properties:
                    id: { type: string, format: uuid }
                    title: { type: string }
                    content: { type: string }
                    folder_name: { type: string }
                    folder_color: { type: string }
                    icon: { type: string }
                    tags: { type: array, items: { type: string } }
                    trashed_at: { type: [string, "null"], format: date-time }
                    is_public: { type: boolean, description: Owner only. Stripped from a keyed request. }
                    locked: { type: boolean, description: Owner only. false also clears the passcode. }
                    lock_password: { type: string, description: Owner only. Hashed before it is stored. }
                    frozen: { type: boolean }
                    doc: { type: object }
                - type: object
                  required: [updates]
                  properties:
                    updates: { type: array, items: { type: object, required: [id] } }
                - type: object
                  properties: { rename_note: { type: object, required: [id, title] } }
                - type: object
                  properties: { rename_folder: { type: object, required: [from, to] } }
                - type: object
                  properties: { merge_folder: { type: object, required: [from, to] } }
                - type: object
                  properties: { pinned_folders: { type: array, items: { type: string } } }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  note: { $ref: '#/components/schemas/Note' }
                  locked_skipped: { type: array, items: { type: string }, description: Frozen ids a batch left alone. }
        '400': { $ref: '#/components/responses/Unauthorized' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423':
          description: The note is frozen. Only frozen and the sharing fields are accepted.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    delete:
      summary: Delete a note or an empty folder
      description: Owner sessions only. An API key is always refused, so a leaked key cannot destroy notes.
      parameters:
        - { name: id, in: query, schema: { type: string, format: uuid } }
        - { name: folder_name, in: query, schema: { type: string }, description: Must be empty, unless it is TRASH. }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  deleted_note: { type: string }
                  deleted_folder: { type: string }
        '400': { description: Neither id nor folder_name was given. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The folder still holds notes. The body carries note_count.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '423': { description: The note is frozen. Unfreeze it first. }

  /ext:
    get:
      summary: The same notes surface for agents and scripts
      description: >
        Identical handlers to /notes, reached with a STICKIES_API_KEY bearer.
        Kept as its own path because the existing automations point at it.
        DELETE is refused here exactly as it is on /notes.
      responses:
        '200': { description: As /notes }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /public:
    get:
      summary: Read a shared note without authenticating
      security: []
      parameters:
        - { name: noteId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The note, or a locked stub when a passcode is set.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [title, content]
                    properties:
                      title: { type: string }
                      content: { type: string }
                      type: { type: [string, "null"] }
                      folder_color: { type: string }
                  - type: object
                    required: [locked]
                    properties:
                      locked: { type: boolean, enum: [true] }
                      title: { type: string }
                      folder_color: { type: string }
        '400': { description: Missing noteId }
        '404': { description: Not shared, or no such note. The two are indistinguishable on purpose. }
